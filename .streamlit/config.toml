[theme]
base = "light"
primaryColor = "#167D8D"
backgroundColor = "#F8F7F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
linkColor = "#167D8D"
codeTextColor = "#344054"
codeBackgroundColor = "#F2F2EF"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontSizes = ["2.1rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "8px"
borderColor = "#E5E7EB"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F7F3"
headingFontSizes = ["1.3rem", "1.1rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
headless = true
address = "localhost"  # local only: the app has no authentication
maxUploadSize = 20  # matches the backend default MAX_UPLOAD_MB

[browser]
gatherUsageStats = false
